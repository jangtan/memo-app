<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모장</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="메모장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #ffffff;
    --side: #f7f6f3;
    --hover: #ebebea;
    --active: #e3e2e0;
    --text: #37352f;
    --muted: #9b9a97;
    --border: #e9e9e7;
    --accent: #2383e2;
    --danger: #eb5757;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --side: #202020;
      --hover: #2b2b2b;
      --active: #343434;
      --text: #e6e6e4;
      --muted: #7f7f7c;
      --border: #2f2f2f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: flex; height: 100%; height: 100dvh; }

  /* sidebar */
  .side {
    width: 280px; flex-shrink: 0;
    background: var(--side);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .side-head { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  .brand { font-weight: 600; font-size: 14px; padding: 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .brand small { color: var(--muted); font-weight: 400; }
  .search {
    width: 100%; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: inherit; font-size: 14px; outline: none;
  }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(35,131,226,.18); }
  .new-btn {
    border: none; background: transparent; text-align: left;
    padding: 7px 8px; border-radius: 6px; font-size: 14px; color: var(--muted);
  }
  .new-btn:hover { background: var(--hover); color: var(--text); }
  .list { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .item {
    display: block; width: 100%; text-align: left; border: none; background: transparent;
    padding: 8px 10px; border-radius: 6px; margin-bottom: 2px;
  }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--active); }
  .item .t { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t.empty { color: var(--muted); font-weight: 400; }
  .item .p { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item mark { background: rgba(255, 212, 0, .4); color: inherit; border-radius: 2px; }
  .none { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 12px; line-height: 1.6; }

  /* editor */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    min-height: 46px; color: var(--muted); font-size: 12px;
  }
  .bar .spacer { flex: 1; }
  .icon-btn {
    border: none; background: transparent; padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--muted);
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn.del:hover { color: var(--danger); }
  .back { display: none; }
  .editor { flex: 1; overflow-y: auto; }
  .page { max-width: 760px; margin: 0 auto; padding: 24px 56px 80px; }
  .title {
    width: 100%; border: none; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 40px; font-weight: 700; line-height: 1.2; padding: 0; margin-bottom: 12px;
  }
  .body {
    width: 100%; border: none; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.7; resize: none; padding: 0; min-height: 50vh; display: block;
  }
  .title::placeholder, .body::placeholder { color: var(--muted); opacity: .6; }
  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--muted); font-size: 15px;
  }
  .primary {
    border: none; background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 14px;
  }
  .primary:hover { filter: brightness(1.08); }

  /* mobile */
  @media (max-width: 720px) {
    .side { width: 100%; border-right: none; }
    .main { display: none; width: 100%; }
    .app.editing .side { display: none; }
    .app.editing .main { display: flex; }
    .back { display: inline-block; }
    .page { padding: 12px 18px 80px; }
    .title { font-size: 28px; }
    .item { padding: 11px 10px; }
    .search, .body { font-size: 16px; } /* iOS 확대 방지 */
    .empty-state.desktop-only { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand"><span>📝 내 메모</span><small id="count"></small></div>
      <input class="search" id="search" type="search" placeholder="검색" autocomplete="off">
      <button class="new-btn" id="newBtn">＋ 새 메모</button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <section class="main" id="main">
    <div class="bar">
      <button class="icon-btn back" id="backBtn">← 목록</button>
      <span id="status"></span>
      <span class="spacer"></span>
      <button class="icon-btn del" id="delBtn">삭제</button>
    </div>
    <div class="editor" id="editor">
      <div class="page">
        <input class="title" id="title" placeholder="제목 없음" autocomplete="off">
        <textarea class="body" id="body" placeholder="여기에 내용을 입력하세요…"></textarea>
      </div>
    </div>
    <div class="empty-state desktop-only" id="emptyState" hidden>
      <div>메모를 선택하거나 새로 만드세요</div>
      <button class="primary" id="emptyNew">＋ 새 메모</button>
    </div>
  </section>
</div>

<script>
(() => {
  const KEY = 'memo-app-v1';
  const $ = id => document.getElementById(id);
  const el = {
    app: $('app'), list: $('list'), search: $('search'), count: $('count'),
    title: $('title'), body: $('body'), status: $('status'),
    editor: $('editor'), empty: $('emptyState'), bar: document.querySelector('.bar'),
  };

  let notes = [];
  let currentId = null;
  let query = '';
  let saveTimer = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const data = raw ? JSON.parse(raw) : null;
      if (data && Array.isArray(data.notes)) {
        notes = data.notes;
        currentId = data.currentId;
        return;
      }
    } catch (e) {}
    const now = Date.now();
    notes = [{
      id: uid(), title: '환영합니다 👋',
      body: '왼쪽 목록에서 메모를 고르거나 "새 메모"로 새로 만들 수 있어요.\n입력하는 내용은 이 브라우저에 자동 저장되어 새로고침해도 남아 있습니다.',
      created: now, updated: now,
    }];
    currentId = notes[0].id;
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ notes, currentId }));
      el.status.textContent = '저장됨';
    } catch (e) {
      el.status.textContent = '저장 실패 (저장 공간 확인)';
    }
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  const current = () => notes.find(n => n.id === currentId);
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const re = new RegExp('(' + esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  }

  function snippet(n, q) {
    const flat = n.body.replace(/\s+/g, ' ').trim();
    if (!q) return flat.slice(0, 60);
    const i = flat.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return flat.slice(0, 60);
    const start = Math.max(0, i - 15);
    return (start > 0 ? '…' : '') + flat.slice(start, start + 60);
  }

  function formatDate(ts) {
    const d = new Date(ts), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const pad = x => String(x).padStart(2, '0');
    return sameDay ? `${pad(d.getHours())}:${pad(d.getMinutes())}`
      : `${d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '. '}${d.getMonth() + 1}. ${d.getDate()}.`;
  }

  function filtered() {
    const q = query.trim().toLowerCase();
    return notes
      .filter(n => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q))
      .sort((a, b) => b.updated - a.updated);
  }

  function renderList() {
    const q = query.trim();
    const items = filtered();
    el.count.textContent = notes.length + '개';
    if (!items.length) {
      el.list.innerHTML = `<div class="none">${q ? '검색 결과가 없습니다' : '메모가 없습니다<br>"새 메모"를 눌러 시작하세요'}</div>`;
      return;
    }
    el.list.innerHTML = items.map(n => `
      <button class="item${n.id === currentId ? ' active' : ''}" data-id="${n.id}">
        <div class="t${n.title ? '' : ' empty'}">${n.title ? highlight(n.title, q) : '제목 없음'}</div>
        <div class="p">${formatDate(n.updated)} · ${highlight(snippet(n, q) || '내용 없음', q)}</div>
      </button>`).join('');
  }

  function renderEditor() {
    const n = current();
    el.bar.hidden = el.editor.hidden = !n;
    el.empty.hidden = !!n;
    if (!n) { el.app.classList.remove('editing'); return; }
    if (el.title.value !== n.title) el.title.value = n.title;
    if (el.body.value !== n.body) el.body.value = n.body;
    el.status.textContent = '수정: ' + new Date(n.updated).toLocaleString('ko-KR');
    autosize();
  }

  function autosize() {
    el.body.style.height = 'auto';
    el.body.style.height = Math.max(el.body.scrollHeight, window.innerHeight * 0.5) + 'px';
  }

  function select(id, openEditor = true) {
    currentId = id;
    persist();
    renderList();
    renderEditor();
    if (openEditor) el.app.classList.add('editing');
  }

  function createNote() {
    const now = Date.now();
    const n = { id: uid(), title: '', body: '', created: now, updated: now };
    notes.unshift(n);
    query = ''; el.search.value = '';
    select(n.id);
    el.title.focus();
  }

  function deleteCurrent() {
    const n = current();
    if (!n) return;
    const label = n.title || '제목 없음';
    if (!confirm(`"${label}" 메모를 삭제할까요?`)) return;
    const list = filtered();
    const idx = list.findIndex(x => x.id === n.id);
    notes = notes.filter(x => x.id !== n.id);
    const next = filtered()[Math.min(Math.max(idx, 0), filtered().length - 1)];
    currentId = next ? next.id : null;
    persist();
    renderList();
    renderEditor();
    el.app.classList.remove('editing');
  }

  function onEdit() {
    const n = current();
    if (!n) return;
    n.title = el.title.value;
    n.body = el.body.value;
    n.updated = Date.now();
    autosize();
    el.status.textContent = '저장 중…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { persist(); renderList(); }, 250);
  }

  // 이벤트
  el.list.addEventListener('click', e => {
    const b = e.target.closest('.item');
    if (b) select(b.dataset.id);
  });
  el.search.addEventListener('input', () => { query = el.search.value; renderList(); });
  $('newBtn').addEventListener('click', createNote);
  $('emptyNew').addEventListener('click', createNote);
  $('delBtn').addEventListener('click', deleteCurrent);
  $('backBtn').addEventListener('click', () => { el.app.classList.remove('editing'); renderList(); });
  el.title.addEventListener('input', onEdit);
  el.body.addEventListener('input', onEdit);
  el.title.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); el.body.focus(); }
  });
  window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); persist(); });
  window.addEventListener('resize', autosize);
  // 다른 탭에서 바뀐 내용 반영
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    load(); renderList(); renderEditor();
  });

  load();
  renderList();
  renderEditor();

  // PWA: 오프라인 동작을 위한 서비스 워커 등록
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
