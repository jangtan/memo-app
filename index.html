<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모장</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="메모">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --paper: #ffffff;
    --text: #000000;
    --muted: #8a8a8e;
    --sep: #e5e5ea;
    --field: rgba(118, 118, 128, .12);
    --accent: #d99a00;
    --on-accent: #ffffff;
    --select: #ffe9a8;
    --mark: rgba(255, 204, 0, .45);
    --danger: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --paper: #000000;
      --text: #ffffff;
      --muted: #8e8e93;
      --sep: #38383a;
      --field: rgba(118, 118, 128, .24);
      --accent: #ffd60a;
      --on-accent: #000000;
      --select: #4a3d00;
      --mark: rgba(255, 214, 10, .4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
  svg { display: block; }
  .app { display: flex; height: 100%; height: 100dvh; }

  /* ---------- 목록 ---------- */
  .side {
    width: 360px; flex-shrink: 0; background: var(--bg);
    display: flex; flex-direction: column;
    border-right: .5px solid var(--sep);
    padding-top: env(safe-area-inset-top);
  }
  .side-head { padding: 22px 16px 6px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px 4px; min-height: 41px; }
  .big-title { font-size: 34px; font-weight: 700; letter-spacing: -.3px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { width: 32px; height: 32px; border-radius: 50%; background: var(--field); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search {
    width: 100%; height: 36px; border: none; outline: none; border-radius: 10px;
    background: var(--field); color: var(--text); font: inherit; font-size: 17px;
    padding: 0 10px 0 34px; -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: var(--muted); }
  .search::-webkit-search-cancel-button { opacity: .6; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { padding: 6px 13px; border-radius: 16px; background: var(--field); font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
  .chip.on { background: var(--accent); color: var(--on-accent); }
  .chip.add { color: var(--accent); background: transparent; border: 1px dashed var(--sep); }
  .list { flex: 1; overflow-y: auto; padding: 6px 16px 16px; }
  .group-title { font-size: 20px; font-weight: 700; margin: 18px 0 8px 4px; letter-spacing: -.2px; display: flex; align-items: center; gap: 6px; }
  .group-title:first-child { margin-top: 8px; }
  .group-title svg { color: var(--muted); }
  .card { background: var(--card); border-radius: 12px; overflow: hidden; }

  .row { position: relative; overflow: hidden; touch-action: pan-y; background: var(--card); }
  .act {
    position: absolute; top: 0; bottom: 0; width: 80px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; color: #fff; font-size: 12px; font-weight: 500;
  }
  .act.pin { left: 0; background: #ff9f0a; }
  .act.del { right: 0; background: var(--danger); }
  .item {
    position: relative; display: block; width: 100%; text-align: left; padding: 0 0 0 16px;
    background: var(--card); transition: transform .22s ease; user-select: none; -webkit-user-select: none;
  }
  .row.drag .item { transition: none; }
  .row.open-l .item { transform: translateX(80px); }
  .row.open-r .item { transform: translateX(-80px); }
  .item .in { padding: 10px 16px 10px 0; border-bottom: .5px solid var(--sep); min-width: 0; }
  .row:last-child .in { border-bottom: none; }
  .item.active, .item.active .in { background: var(--select); }
  .item .t { font-size: 17px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .p { font-size: 15px; line-height: 1.35; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .item .p b { font-weight: 400; color: var(--text); opacity: .75; margin-right: 6px; }
  .item .f { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; }
  .none { color: var(--muted); text-align: center; padding: 48px 12px; font-size: 17px; }
  .foot {
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
    padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
    border-top: .5px solid var(--sep); background: var(--bg);
  }
  .foot .cnt { text-align: center; font-size: 11px; color: var(--muted); }
  .tool { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--accent); border-radius: 10px; }
  .tool:active { opacity: .5; }
  .tool.on svg { fill: currentColor; }

  /* ---------- 편집 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--paper); }
  .bar {
    display: flex; align-items: center; gap: 0; min-height: 48px;
    padding: calc(2px + env(safe-area-inset-top)) 4px 2px 8px;
  }
  .bar .spacer { flex: 1; }
  .back { display: none; align-items: center; color: var(--accent); font-size: 17px; height: 44px; padding: 0 8px 0 0; }
  .back:active { opacity: .5; }
  .editor { flex: 1; overflow-y: auto; }
  .page { max-width: 720px; margin: 0 auto; padding: 4px 24px 96px; }
  .stamp { text-align: center; font-size: 12px; color: var(--muted); margin: 6px 0 14px; }
  .title {
    width: 100%; border: none; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 28px; font-weight: 700; line-height: 1.25; padding: 0; margin-bottom: 8px;
    letter-spacing: -.3px; caret-color: var(--accent);
  }
  .body {
    width: 100%; border: none; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 17px; line-height: 1.5; resize: none; padding: 0; display: block; min-height: 50vh;
    caret-color: var(--accent);
  }
  .title::placeholder, .body::placeholder { color: var(--muted); opacity: .6; }
  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 17px; }

  /* ---------- 액션 시트 ---------- */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .35);
    display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease;
  }
  .sheet { width: 100%; max-width: 420px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); animation: rise .22s ease; }
  .sheet-group { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
  .sheet-title { text-align: center; font-size: 13px; color: var(--muted); padding: 14px 16px; }
  .sheet button { display: block; width: 100%; padding: 16px; font-size: 19px; color: var(--accent); border-top: .5px solid var(--sep); position: relative; }
  .sheet button:active { background: var(--field); }
  .sheet button.danger { color: var(--danger); }
  .sheet button.cancel { font-weight: 600; border-top: none; }
  .sheet button.checked::after { content: "✓"; position: absolute; right: 18px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } }

  /* ---------- 모바일 ---------- */
  @media (max-width: 720px) {
    .side { width: 100%; border-right: none; }
    .main { display: none; width: 100%; }
    .app.editing .side { display: none; }
    .app.editing .main { display: flex; }
    .back { display: inline-flex; }
    .page { padding: 4px 20px 96px; }
    .empty-state { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="title-row">
        <h1 class="big-title" id="bigTitle">메모</h1>
        <button class="more" id="moreBtn" aria-label="폴더 관리" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </div>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input class="search" id="search" type="search" placeholder="검색" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">
      <span></span>
      <span class="cnt" id="count"></span>
      <button class="tool" id="newBtn" aria-label="새로운 메모">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="M18.4 3.6a1.8 1.8 0 0 1 2.5 2.5L12 15l-3.5 1 1-3.5z"/></svg>
      </button>
    </div>
  </aside>

  <section class="main" id="main">
    <div class="bar">
      <button class="back" id="backBtn" aria-label="목록으로">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M10 2 2 10l8 8"/></svg>메모
      </button>
      <span class="spacer"></span>
      <button class="tool" id="pinBtn" aria-label="고정">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-.8 6 3 3.2H6.8L9.8 10z"/><path d="M12 13.2V20"/></svg>
      </button>
      <button class="tool" id="folderBtn" aria-label="폴더로 이동">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2V16a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="tool" id="delBtn" aria-label="삭제">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5A.5.5 0 0 1 9.5 4h5a.5.5 0 0 1 .5.5V7"/></svg>
      </button>
      <button class="tool" id="newBtn2" aria-label="새로운 메모">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="M18.4 3.6a1.8 1.8 0 0 1 2.5 2.5L12 15l-3.5 1 1-3.5z"/></svg>
      </button>
    </div>
    <div class="editor" id="editor">
      <div class="page">
        <div class="stamp" id="stamp"></div>
        <input class="title" id="title" placeholder="제목" autocomplete="off" enterkeyhint="next">
        <textarea class="body" id="body" placeholder="메모를 입력하세요"></textarea>
      </div>
    </div>
    <div class="empty-state" id="emptyState" hidden>메모를 선택하세요</div>
  </section>
</div>

<script>
(() => {
  const KEY = 'memo-app-v1';
  const SWIPE = 80;
  const $ = id => document.getElementById(id);
  const el = {
    app: $('app'), list: $('list'), search: $('search'), count: $('count'), chips: $('chips'),
    bigTitle: $('bigTitle'), more: $('moreBtn'), pin: $('pinBtn'),
    title: $('title'), body: $('body'), stamp: $('stamp'),
    editor: $('editor'), empty: $('emptyState'), bar: document.querySelector('.bar'),
  };

  const ICON = {
    pin: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-.8 6 3 3.2H6.8L9.8 10z"/><path d="M12 13.2V20"/></svg>',
    trash: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5A.5.5 0 0 1 9.5 4h5a.5.5 0 0 1 .5.5V7"/></svg>',
    folder: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2V16a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>',
    pinSmall: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-.8 6 3 3.2H6.8L9.8 10z"/><path d="M12 13.2V20"/></svg>',
  };

  let notes = [];
  let folders = [];
  let view = 'all';        // 'all' 또는 폴더 id
  let currentId = null;
  let query = '';
  let saveTimer = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const data = raw ? JSON.parse(raw) : null;
      if (data && Array.isArray(data.notes)) {
        notes = data.notes;
        folders = Array.isArray(data.folders) ? data.folders : [];
        currentId = data.currentId;
        view = data.view && folders.some(f => f.id === data.view) ? data.view : 'all';
        return;
      }
    } catch (e) {}
    const now = Date.now();
    notes = [{
      id: uid(), title: '환영합니다',
      body: '아래쪽 연필 버튼으로 새로운 메모를 만들 수 있어요.\n목록에서 메모를 오른쪽으로 밀면 고정, 왼쪽으로 밀면 삭제됩니다.\n입력한 내용은 이 기기의 브라우저에 자동 저장됩니다.',
      created: now, updated: now,
    }];
    folders = [];
    view = 'all';
    currentId = notes[0].id;
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ notes, folders, view, currentId })); } catch (e) {}
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  const current = () => notes.find(n => n.id === currentId);
  const folderName = id => (folders.find(f => f.id === id) || {}).name || '';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const re = new RegExp('(' + esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  }

  function snippet(n, q) {
    const flat = n.body.replace(/\s+/g, ' ').trim();
    if (!q) return flat.slice(0, 80);
    const i = flat.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return flat.slice(0, 80);
    const start = Math.max(0, i - 15);
    return (start > 0 ? '…' : '') + flat.slice(start, start + 80);
  }

  const dayStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
  const dayDiff = ts => Math.round((dayStart(Date.now()) - dayStart(ts)) / 86400000);

  function rowDate(ts) {
    const diff = dayDiff(ts), d = new Date(ts);
    if (diff <= 0) return d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
    if (diff === 1) return '어제';
    if (diff < 7) return d.toLocaleDateString('ko-KR', { weekday: 'long' });
    return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
  }

  function groupName(ts) {
    const diff = dayDiff(ts), d = new Date(ts);
    if (diff <= 0) return '오늘';
    if (diff === 1) return '어제';
    if (diff < 7) return '지난 7일';
    if (diff < 30) return '지난 30일';
    return d.getFullYear() === new Date().getFullYear() ? `${d.getMonth() + 1}월` : `${d.getFullYear()}년`;
  }

  function stampText(ts) {
    return new Date(ts).toLocaleString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  const viewNotes = () => notes.filter(n => view === 'all' || n.folder === view);

  function filtered() {
    const q = query.trim().toLowerCase();
    return viewNotes()
      .filter(n => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q))
      .sort((a, b) => b.updated - a.updated);
  }

  function rowHtml(n, q) {
    const showFolder = view === 'all' && n.folder && folderName(n.folder);
    return `<div class="row" data-id="${n.id}">
      <button class="act pin" data-act="pin">${ICON.pin}<span>${n.pinned ? '고정 해제' : '고정'}</span></button>
      <button class="act del" data-act="del">${ICON.trash}<span>삭제</span></button>
      <button class="item${n.id === currentId ? ' active' : ''}" data-id="${n.id}"><div class="in">
        <div class="t">${n.title ? highlight(n.title, q) : '새로운 메모'}</div>
        <div class="p"><b>${rowDate(n.updated)}</b>${highlight(snippet(n, q) || '추가 텍스트 없음', q)}</div>
        ${showFolder ? `<div class="f">${ICON.folder}${esc(folderName(n.folder))}</div>` : ''}
      </div></button>
    </div>`;
  }

  function renderChips() {
    const chip = (id, name) => `<button class="chip${view === id ? ' on' : ''}" data-folder="${id}">${esc(name)}</button>`;
    el.chips.innerHTML = chip('all', '모든 메모') + folders.map(f => chip(f.id, f.name)).join('')
      + '<button class="chip add" data-add="1">＋ 새 폴더</button>';
    el.bigTitle.textContent = view === 'all' ? '메모' : folderName(view);
    el.more.hidden = view === 'all';
  }

  function renderList() {
    const q = query.trim();
    const items = filtered();
    el.count.textContent = viewNotes().length + '개의 메모';
    openRow = null;
    if (!items.length) {
      el.list.innerHTML = `<div class="none">${q ? '검색 결과 없음' : '메모 없음'}</div>`;
      return;
    }
    const card = arr => `<div class="card">${arr.map(n => rowHtml(n, q)).join('')}</div>`;
    let html = '';
    if (q) {
      html = `<div class="group-title">검색 결과</div>${card(items)}`;
    } else {
      const pinned = items.filter(n => n.pinned);
      if (pinned.length) html += `<div class="group-title">${ICON.pinSmall}고정됨</div>${card(pinned)}`;
      const groups = [];
      for (const n of items.filter(n => !n.pinned)) {
        const g = groupName(n.updated);
        const last = groups[groups.length - 1];
        if (last && last.name === g) last.items.push(n); else groups.push({ name: g, items: [n] });
      }
      html += groups.map(g => `<div class="group-title">${g.name}</div>${card(g.items)}`).join('');
    }
    el.list.innerHTML = html;
  }

  function renderEditor() {
    const n = current();
    el.bar.hidden = el.editor.hidden = !n;
    el.empty.hidden = !!n;
    if (!n) { el.app.classList.remove('editing'); return; }
    if (el.title.value !== n.title) el.title.value = n.title;
    if (el.body.value !== n.body) el.body.value = n.body;
    el.stamp.textContent = stampText(n.updated);
    el.pin.classList.toggle('on', !!n.pinned);
    autosize();
  }

  const renderAll = () => { renderChips(); renderList(); renderEditor(); };

  function autosize() {
    el.body.style.height = 'auto';
    el.body.style.height = Math.max(el.body.scrollHeight, window.innerHeight * 0.5) + 'px';
  }

  function select(id, openEditor = true) {
    currentId = id;
    persist();
    renderList();
    renderEditor();
    if (openEditor) el.app.classList.add('editing');
  }

  function createNote() {
    const now = Date.now();
    const n = { id: uid(), title: '', body: '', created: now, updated: now, pinned: false, folder: view === 'all' ? null : view };
    notes.unshift(n);
    query = ''; el.search.value = '';
    select(n.id);
    el.title.focus();
  }

  function togglePin(id) {
    const n = notes.find(x => x.id === id);
    if (!n) return;
    n.pinned = !n.pinned;
    persist();
    renderList();
    renderEditor();
  }

  function deleteNote(id) {
    const n = notes.find(x => x.id === id);
    if (!n) return;
    const list = filtered();
    const idx = list.findIndex(x => x.id === id);
    notes = notes.filter(x => x.id !== id);
    if (id === currentId) {
      const rest = filtered();
      const next = rest[Math.min(Math.max(idx, 0), rest.length - 1)];
      currentId = next ? next.id : null;
      el.app.classList.remove('editing');
    }
    persist();
    renderAll();
  }

  function askDelete(id) {
    const n = notes.find(x => x.id === id);
    if (!n) return;
    sheet(`"${n.title || '새로운 메모'}" 메모를 삭제할까요?`, [
      { label: '삭제', danger: true, run: () => deleteNote(id) },
    ], () => renderList());
  }

  function onEdit() {
    const n = current();
    if (!n) return;
    n.title = el.title.value;
    n.body = el.body.value;
    n.updated = Date.now();
    el.stamp.textContent = stampText(n.updated);
    autosize();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { persist(); renderList(); }, 250);
  }

  // ---------- 폴더 ----------
  function askName(message, initial) {
    const name = prompt(message, initial || '');
    return name && name.trim() ? name.trim().slice(0, 30) : null;
  }

  function addFolder() {
    const name = askName('새 폴더 이름');
    if (!name) return null;
    const f = { id: uid(), name };
    folders.push(f);
    return f;
  }

  function moveSheet() {
    const n = current();
    if (!n) return;
    sheet('폴더로 이동', [
      { label: '폴더 없음', checked: !n.folder, run: () => moveTo(n, null) },
      ...folders.map(f => ({ label: f.name, checked: n.folder === f.id, run: () => moveTo(n, f.id) })),
      { label: '＋ 새 폴더…', run: () => { const f = addFolder(); if (f) moveTo(n, f.id); } },
    ]);
  }

  function moveTo(n, folderId) {
    n.folder = folderId;
    persist();
    renderAll();
  }

  function manageFolder() {
    const f = folders.find(x => x.id === view);
    if (!f) return;
    sheet(f.name, [
      { label: '이름 변경', run: () => { const name = askName('폴더 이름', f.name); if (name) { f.name = name; persist(); renderAll(); } } },
      { label: '폴더 삭제 (메모는 유지)', danger: true, run: () => {
        folders = folders.filter(x => x.id !== f.id);
        notes.forEach(n => { if (n.folder === f.id) n.folder = null; });
        view = 'all';
        persist(); renderAll();
      } },
    ]);
  }

  // ---------- 액션 시트 ----------
  let closeSheet = null;
  function sheet(title, options, onCancel) {
    if (closeSheet) closeSheet();
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog"><div class="sheet-group">
      ${title ? `<div class="sheet-title">${esc(title)}</div>` : ''}
      ${options.map((o, i) => `<button data-i="${i}" class="${o.danger ? 'danger' : ''}${o.checked ? ' checked' : ''}">${esc(o.label)}</button>`).join('')}
    </div><div class="sheet-group"><button class="cancel" data-i="c">취소</button></div></div>`;
    let ran = false;
    const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); closeSheet = null; };
    const cancel = () => { close(); if (!ran && onCancel) onCancel(); };
    const onKey = e => { if (e.key === 'Escape') cancel(); };
    bg.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) { if (e.target === bg) cancel(); return; }
      if (b.dataset.i === 'c') return cancel();
      ran = true;
      close();
      options[+b.dataset.i].run();
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg);
    closeSheet = close;
  }

  // ---------- 스와이프 (오른쪽: 고정, 왼쪽: 삭제) ----------
  let openRow = null;
  let swipe = null;
  let suppressClick = false;

  function setRow(row, state) {
    row.classList.remove('open-l', 'open-r');
    row.style.removeProperty('--x');
    const item = row.querySelector('.item');
    item.style.transform = '';
    if (state) row.classList.add(state);
    openRow = state ? row : (openRow === row ? null : openRow);
  }

  el.list.addEventListener('pointerdown', e => {
    const row = e.target.closest('.row');
    if (!row || e.target.closest('.act')) return;
    if (openRow && openRow !== row) setRow(openRow, null);
    const base = row.classList.contains('open-l') ? SWIPE : row.classList.contains('open-r') ? -SWIPE : 0;
    swipe = { row, x: e.clientX, y: e.clientY, base, active: false, dx: 0 };
  });

  el.list.addEventListener('pointermove', e => {
    if (!swipe) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (!swipe.active) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        swipe.active = true;
        swipe.row.classList.add('drag');
        try { swipe.row.setPointerCapture(e.pointerId); } catch (_) {}
      } else if (Math.abs(dy) > 8) { swipe = null; return; }
      else return;
    }
    swipe.dx = dx;
    const x = Math.max(-SWIPE * 1.3, Math.min(SWIPE * 1.3, swipe.base + dx));
    swipe.row.querySelector('.item').style.transform = `translateX(${x}px)`;
  });

  function endSwipe() {
    if (!swipe) return;
    const { row, base, dx, active } = swipe;
    swipe = null;
    if (!active) return;
    row.classList.remove('drag');
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 50);
    const x = base + dx;
    setRow(row, x > SWIPE / 2 ? 'open-l' : x < -SWIPE / 2 ? 'open-r' : null);
    openRow = row.classList.contains('open-l') || row.classList.contains('open-r') ? row : null;
  }
  el.list.addEventListener('pointerup', endSwipe);
  el.list.addEventListener('pointercancel', endSwipe);

  el.list.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; e.stopPropagation(); return; }
    const act = e.target.closest('.act');
    if (act) {
      const id = act.closest('.row').dataset.id;
      if (act.dataset.act === 'pin') togglePin(id); else askDelete(id);
      return;
    }
    const item = e.target.closest('.item');
    if (!item) return;
    const row = item.closest('.row');
    if (row.classList.contains('open-l') || row.classList.contains('open-r')) { setRow(row, null); return; }
    select(item.dataset.id);
  });

  // ---------- 이벤트 ----------
  el.chips.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    if (b.dataset.add) {
      const f = addFolder();
      if (!f) return;
      view = f.id;
    } else {
      view = b.dataset.folder;
    }
    persist();
    renderChips();
    renderList();
  });
  el.more.addEventListener('click', manageFolder);
  el.search.addEventListener('input', () => { query = el.search.value; renderList(); });
  $('newBtn').addEventListener('click', createNote);
  $('newBtn2').addEventListener('click', createNote);
  $('delBtn').addEventListener('click', () => current() && askDelete(currentId));
  el.pin.addEventListener('click', () => togglePin(currentId));
  $('folderBtn').addEventListener('click', moveSheet);
  $('backBtn').addEventListener('click', () => { el.app.classList.remove('editing'); renderList(); });
  el.title.addEventListener('input', onEdit);
  el.body.addEventListener('input', onEdit);
  el.title.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); el.body.focus(); }
  });
  window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); persist(); });
  window.addEventListener('resize', autosize);
  // 다른 탭에서 바뀐 내용 반영
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    load(); renderAll();
  });

  load();
  renderAll();

  // PWA: 오프라인 동작을 위한 서비스 워커 등록
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
